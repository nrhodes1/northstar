# ---------------------------------------------------------------------------
# MASSING — exterior outline of each storey (finished exterior face of wall)
# ---------------------------------------------------------------------------
# Each storey lists one or more closed polygons (counter-clockwise or not —
# the builder normalises). Coordinates are [x, y] in feet, drawing frame
# (see project.yaml). Seeded from the vector linework of A1.01–A1.04 via
# tools/extract_pdf.py, then cleaned by hand (see decisions.md D-003).
#
# A storey's walls run from its level to the next level up. Wherever a
# storey's footprint is larger than the one above, the difference becomes a
# roof or terrace (see roofs.yaml); the top storey's footprint is the roof.
# ---------------------------------------------------------------------------

reference_face: exterior   # outline = outside face of cladding

storeys:
  L1:
    # Ground floor is set back ~1'-0" from the upper floors on the street
    # faces (NE, NW, SE); upper floors oversail.
