# ---------------------------------------------------------------------------
# MATERIALS — one library for Rhino display colours AND Blender shaders
# ---------------------------------------------------------------------------
# Cladding rib profiles come from envelope.yaml cladding_types (not here).
# tex: {id: <Poly Haven texture id in assets.yaml>, size: <metres per tile>,
#       mode: full | tint | detail}
#   full   = photo colour   tint = photo detail x `color`   detail = only
#   roughness/normal from the photo (colour stays `color`).
# shader: principled | corrugated_metal | glass | foliage | procedural_wood
#         | pavers | grass | asphalt | sedum
# color: sRGB 0-1. roughness / metallic: Principled BSDF values.
# tex: optional {scale_m, ...} for procedural detail.
# To restyle the building, change entries here — geometry is untouched.
# ---------------------------------------------------------------------------

corrugated_galvalume: {shader: corrugated_metal, color: [0.36, 0.41, 0.47], roughness: 0.48, metallic: 0.55, tex: {id: corrugated_iron_02, size: 2.0, mode: detail}}   # blue-grey (matches design rendering)
