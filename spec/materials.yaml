# shader: principled | corrugated_metal | glass | foliage | procedural_wood
#         | pavers | grass | asphalt | sedum
# color: sRGB 0-1. roughness / metallic: Principled BSDF values.
# tex: optional {scale_m, ...} for procedural detail.
# To restyle the building, change entries here — geometry is untouched.
# ---------------------------------------------------------------------------

