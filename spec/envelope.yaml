# ---------------------------------------------------------------------------
# ENVELOPE — wall assemblies, cladding, parapets, panelization
# ---------------------------------------------------------------------------
# Every exterior wall is built from `assemblies.<name>.layers`, listed from
# OUTSIDE to INSIDE, starting at the outline in massing.yaml.
# Swap cladding with ONE line: set `cladding:` below to any key in
# `cladding_types`. The cladding layer's thickness, material and rendered
# rib profile all come from that entry.
# ---------------------------------------------------------------------------

default_assembly: straw_panel_rainscreen

assemblies:
  straw_panel_rainscreen:
    description: >
      Load-bearing prefabricated straw panel (basis of design: Ecococon;
      New Frameworks equivalent) with ventilated rainscreen.
    cladding: corrugated_metal          # <- ONE-LINE SWAP: corrugated_metal | standing_seam | wood_rainscreen
    layers:                              # outside -> inside
      - {name: cladding,  thickness: CLADDING, material: CLADDING}  # both resolved from cladding_types
      - {name: cavity,    thickness: "1 1/2\"", material: null}     # battens / ventilated gap (no solid)
      - {name: sheathing, thickness: "5/8\"",  material: wood_fibre_board}
      - {name: straw,     thickness: "400mm",  material: straw_panel, structural: true}
      - {name: plaster,   thickness: "3/4\"",  material: clay_plaster}

cladding_types:
  # thickness = depth the cladding occupies in the wall (sheet + profile).
  # profile drives the rendered ribs: shape sine | seam | board,
  # pitch = rib/board spacing, depth = relief, orientation = rib direction.
  corrugated_metal:
    material: corrugated_galvalume
    thickness: "7/8\""
    profile: {shape: sine, pitch: "2 2/3\"", depth: "7/8\"", orientation: vertical}
  standing_seam:
    material: standing_seam_zinc
    thickness: "1\""
    profile: {shape: seam, pitch: "16\"", depth: "1\"", orientation: vertical}
  wood_rainscreen:
    material: charred_larch
    thickness: "3/4\""
    profile: {shape: board, pitch: "5 1/2\"", depth: "1/4\"", orientation: vertical}

panelization:
  # Straw panel modules (Ecococon: 400 mm thick, widths up to 1200 mm).
  # Each wall run is divided into equal panels no wider than module_width.
  # Runs shorter than min_width are flagged (site-built infill); storeys
  # taller than max_height get a horizontal joint (two panel rows).
  module_width: "1200mm"
  min_width: "300mm"
  max_height: "3000mm"

parapet:
  height: "2'-4\""          # above top of roof structure
  coping_material: coping_metal
  coping_overhang: "1 1/2\""

base:
  # L1 sits back ~1'-0" from upper floors (see massing).
  drip_flashing: true            # metal drip at the foot of the cladding
  flashing_material: coping_metal
  flashing_projection: "1\""     # beyond the face of cladding
  flashing_height: "2\""
