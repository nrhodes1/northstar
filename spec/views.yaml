# ---------------------------------------------------------------------------
# VIEWS — cameras, lighting, render settings
# ---------------------------------------------------------------------------
# Camera positions/targets are [x, y, z] in feet, drawing frame
# (z above L1). Lens in mm (full-frame equivalent, 36 mm sensor).
# ---------------------------------------------------------------------------

render:
  engine: CYCLES
  resolution: [2400, 1350]
  samples: 256            # final; drafts override with --samples
  denoise: true
  look: AgX - Base Contrast
  post:                    # compositor
    glare: 0.08            # fog-glow mix on highlights (0 = off)
    vignette: 0.18
    dispersion: 0.004      # lens chromatic fringe
  dof: {fstop: 11}         # depth of field (focus on view target)
  bounces: 12
  exposure: -0.3
  film_transparent: false
  main_view: main_porch   # `--view main` renders this one

lighting:
  # Physical sun from location + date/time (America/New_York).
  date: "2026-10-08"
  time: "17:15"           # low, warm evening sun
  sky: hdri               # hdri (assets.yaml) | nishita
  hdri_strength: 0.8
  hdri_rotation_deg: 0     # spin the sky; the sun lamp below does the key light
  sun_lamp: {strength: 5.0, angle_deg: 1.5, temperature_k: 3700}
  sun_strength: 1.0
  sky_strength: 0.16
  air: 1.0
  dust: 4.0               # haze: softer shadows, warmer sun
  ozone: 1.0

views:
  # Per-view options:
  #   two_point: true        level camera + vertical lens shift (verticals stay vertical)
  #   clear_foreground:      hide context buildings/trees between camera and building
  #       camera             ... from the camera only (still cast shadows, reflect)
  #       all                ... from the render entirely (no shadows either)
  #     (our own landscape trees are never cleared)
  #   aspect: [w, h]         override render aspect for this view
  #   sun: {azimuth, elevation}  artistic sun override for this view (true-north degrees)
  #   ortho: true, ortho_scale: ft   parallel (axonometric) camera, frame width in ft
  #   eye_height: ft         place camera this far above the ground under it
  main_porch:
    description: MAIN VIEW - SW porch from across the street; camera solved to match the design rendering
    position: [46.2, -88.9, 9.6]   # solved from 8 corner correspondences (rms 9 px)
    target: [47.6, -26.5, 9.6]     # yaw 1.8 deg
    lens: 10.0                     # 122 deg horizontal FOV (full-frame equiv.)
    shift: [0.0, 0.048]            # solved principal point (horizon below centre)
    two_point: true
    clear_foreground: all
    sun: {azimuth: 188, elevation: 15}   # ARTISTIC override: warm raking light from the right
    aspect: [2000, 924]
    interior_lights: true
  porch_street:
    description: Street-level view of the shared porch from the River St corner
    position: [-8, -88, 5.4]      # River St, south of the corner
    target: [42, -28, 17]
    lens: 20
  aerial_sw:
    description: Aerial from the southwest, context of block
    position: [-95, -235, 175]
    target: [46, -18, 12]
    lens: 50
  ne_street:
    description: NE facade from across the street
    position: [118, 78, 5.4]
    target: [48, 0, 18]
    lens: 26
  nw_corner:
    description: Commercial corner (NW) - visible from MBTA / Blue Hill Ave approach
    position: [-16, 40, 5.4]       # on River St, north of the site
    target: [4, -18, 15]
    lens: 26
  # --- axonometrics: true parallel projection from each corner of the plan ---
  axon_sw:
    description: Axon from the SW corner (porch side, River St)
    position: [-237, -303, 290]
    target: [46, -20, 18]
    ortho: true
    ortho_scale: 175        # ft across the frame
  axon_se:
    description: Axon from the SE corner
    position: [329, -303, 290]
    target: [46, -20, 18]
    ortho: true
    ortho_scale: 175
    clear_foreground: all   # 6-storey bldg across the street would hide the porch
    clear_margin_m: 22
  axon_ne:
    description: Axon from the NE corner (rear parking / brick neighbours)
    position: [329, 263, 290]
    target: [46, -20, 18]
    ortho: true
    ortho_scale: 175
  axon_nw:
    description: Axon from the NW corner (commercial corner on River St)
    position: [-237, 263, 290]
    target: [46, -20, 18]
    ortho: true
    ortho_scale: 175
